name: Deploy to TEST Server

on:
  pull_request:
    branches:
      - TEST
    types:
      - closed

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.TEST_SSH_PRIVATE_KEY }}

      - name: Skip host key checking
        run: |
          mkdir -p ~/.ssh
          echo -e "Host ${{ secrets.TEST_SSH_HOST }}\n\tStrictHostKeyChecking no\n" >> ~/.ssh/config

      - name: Deploy to TEST Server
        run: |
          rsync -avz ./ ${{ secrets.SSH_USER }}@${{ secrets.TEST_SSH_HOST }}:${{ secrets.TEST_WORK_DIR }}
