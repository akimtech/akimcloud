name: Deploy to Production Server

on:
  pull_request:
    branches:
      - PROD
    types:
      - closed

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Skip host key checking
        run: |
          mkdir -p ~/.ssh
          echo -e "Host ${{ secrets.PROD_SSH_HOST }}\n\tStrictHostKeyChecking no\n" >> ~/.ssh/config

      - name: Deploy to Production Server
        run: |
         rsync -avz --exclude='.git' --exclude='.github' --exclude='.gitignore' ./ ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:${{ secrets.PROD_WORK_DIR }}