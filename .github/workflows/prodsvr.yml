name: Deploy to Production Server

on:
  pull_request:
    branches:
      - PROD
    types:
      - closed

# Never run two deploys to the same server at once
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Guard deploy target
        env:
          TARGET: ${{ secrets.PROD_WORK_DIR }}
        run: |
          if [[ ! "$TARGET" =~ ^/opt/webapp/[A-Za-z0-9][A-Za-z0-9._-]*/?$ ]]; then
            echo "::error::Refusing to deploy: target is not /opt/webapp/<site>"
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.PROD_SSH_PRIVATE_KEY }}

      - name: Skip host key checking
        run: |
          mkdir -p ~/.ssh
          echo -e "Host ${{ secrets.PROD_SSH_HOST }}\n\tStrictHostKeyChecking no\n" >> ~/.ssh/config

      - name: Deploy to Production Server
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.vscode' \
            --exclude='.idea' \
            --exclude='.DS_Store' \
            --exclude='.gitignore' \
            ./ ${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}:${{ secrets.PROD_WORK_DIR }}
